name: Commit Policy
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  commitlint:
    name: CommitLint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional commit headers
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GITHUB_EVENT_PATH -e GITHUB_EVENT_NAME -e GITHUB_REPOSITORY \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}:ro" -w "${GITHUB_WORKSPACE}" \
            ruby:3.4.10@sha256:ce3b7a999d9e430e59e1a12456c631fbea3dd18948c89cf8a913c3566c77b2ae \
            ruby build-support/commit-policy.rb
