name: Build and Deploy

# Manual only. Nothing here runs from a pull request, a push or a tag; the owner starts it from
# master after merging, once CI has passed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-QRReader
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight beta
    if: github.repository == 'qtmleap/QRReader' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, macos, arm64, xcode-27]
    timeout-minutes: 90
    env:
      ENVIRONMENT: CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require selected Xcode 27
        run: |
          xcode-select -p
          xcodebuild -version
          if ! xcodebuild -version | grep -q '^Xcode 27\.'; then
            echo "::error title=Wrong Xcode::This workflow requires Xcode 27 to be the selected Xcode on the runner."
            exit 1
          fi
      - name: Authorize private QuantumLeap dependency
        env:
          QUANTUMLEAP_READ_TOKEN: ${{ secrets.QUANTUMLEAP_READ_TOKEN }}
        run: scripts/ci-quantumleap-auth.sh
      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: python3 scripts/google-service.py --from-env --bundle-id jp.qleap.qrreader --path QRReader/GoogleService-Info.plist
      - name: Select package resolution mode
        run: |
          strict=$(python3 scripts/resolved-pins.py QRReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
          if [ "$strict" = yes ]; then
            echo "PACKAGE_RESOLUTION_ARGS=-onlyUsePackageVersionsFromResolvedFile" >> "$GITHUB_ENV"
          fi
      - name: Prepare signing repository authorization
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          set -euo pipefail
          : "${MATCH_GIT_TOKEN:?MATCH_GIT_TOKEN is required}"
          authorization=$(printf 'x-access-token:%s' "$MATCH_GIT_TOKEN" | base64 | tr -d '\r\n')
          echo "::add-mask::$authorization"
          printf 'MATCH_GIT_BASIC_AUTHORIZATION=%s\n' "$authorization" >> "$GITHUB_ENV"
      - name: Install fastlane
        run: bundle install --jobs 4
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
      - name: Build, verify and upload to TestFlight
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: bundle exec fastlane beta
      - name: Remove injected config
        if: always()
        run: rm -f QRReader/GoogleService-Info.plist
      - name: Remove build products
        if: always()
        run: rm -rf build "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/bundle"
