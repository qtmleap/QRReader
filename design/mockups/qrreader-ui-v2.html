<!--
QRReader UI/UX mock v2 (three patterns, fixed 390x844 canvas). Local state only, no persistence.
Behavior changes below are PROPOSALS, not changes to the actual app:
 - unify scan result and history result into one result screen/sheet
 - history newest-first
 - confirmation before clear-all / single delete (Edit mode)
 - Settings gear in the same app-chrome position on both tabs
 - collapse first run into one screen (Scan / Confirm / Share)
-->
<div id="qrreader-ui-v2">
<style>
#qrreader-ui-v2 { color-scheme: light dark; --k: 1; }
#qrreader-ui-v2 .mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 8px; font-size: 14px; }
#qrreader-ui-v2 .mock-bar label { display: inline-flex; align-items: center; gap: 8px; }
#qrreader-ui-v2 .mock-bar small { opacity: .7; }
#qrreader-ui-v2 .stage { display: flex; justify-content: center; padding: 16px; box-sizing: border-box; }
#qrreader-ui-v2 .stage[hidden] { display: none; }
#qrreader-ui-v2 .device-viewport { position: relative; flex: none; width: calc(390px * var(--k)); height: calc(844px * var(--k)); }

/* ---------- product ---------- */
#qrreader-ui-v2 .phone {
  position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box;
  transform: scale(var(--k)); transform-origin: top left; overflow: hidden; border-radius: 44px;
  background: var(--qr-bg); color: var(--qr-tx); box-shadow: inset 0 0 0 1px var(--qr-ln);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  font-size: 17px; font-weight: 400; line-height: 1.5; text-align: left; --qr-focus: var(--qr-accent); --qr-icon-size: 24px;
}
#qrreader-ui-v2 .phone.native { --qr-r: 12px; --qr-bg: light-dark(#f4f4f6, #000); --qr-surface: light-dark(#fff, #1c1c1e); --qr-tx: light-dark(#111114, #f5f5f7); --qr-sub: light-dark(#66666e, #9a9aa2); --qr-ln: light-dark(#dcdce0, #2c2c2e); --qr-accent: light-dark(#0a68d6, #4da3ff); --qr-on: light-dark(#fff, #00152e); --qr-fill: light-dark(#eceef2, #2a2a2d); --qr-dg: light-dark(#c4201a, #ff8a80); --qr-bar: light-dark(rgba(248,248,250,.94), rgba(24,24,26,.94)); --qr-pop: light-dark(#fff, #2c2c2e); }
#qrreader-ui-v2 .phone.focus { --qr-r: 14px; }
#qrreader-ui-v2 .phone.focus, #qrreader-ui-v2 .phone.focus .sheet { --qr-bg: light-dark(#fff, #0f1114); --qr-surface: light-dark(#f1f2f4, #1b1e23); --qr-tx: light-dark(#101216, #f3f4f6); --qr-sub: light-dark(#5b606a, #a4a9b3); --qr-ln: light-dark(#e3e5e9, #2a2d34); --qr-accent: light-dark(#00796b, #4fd6bf); --qr-on: light-dark(#fff, #00241e); --qr-fill: light-dark(#eceef1, #262a31); --qr-dg: light-dark(#c4201a, #ff8a80); --qr-bar: light-dark(rgba(255,255,255,.94), rgba(15,17,20,.94)); --qr-pop: light-dark(#fff, #1f2329); }
#qrreader-ui-v2 .phone.focus .dark { --qr-tx: #fff; --qr-sub: rgba(255,255,255,.74); --qr-ln: rgba(255,255,255,.18); --qr-surface: rgba(255,255,255,.12); --qr-fill: rgba(255,255,255,.16); --qr-accent: #4fd6bf; --qr-on: #00241e; --qr-bar: rgba(14,16,19,.72); --qr-focus: #fff; --qr-dg: #ff9a90; color: #fff; }
#qrreader-ui-v2 .phone.soft { --qr-r: 14px; --qr-bg: light-dark(#f3f5f9, #0d1322); --qr-surface: light-dark(#fff, #161f36); --qr-tx: light-dark(#16203a, #eef1f8); --qr-sub: light-dark(#5d6780, #9aa6c2); --qr-ln: light-dark(#dde2ec, #26314f); --qr-accent: light-dark(#23407a, #93b2ff); --qr-on: light-dark(#fff, #0c1a3a); --qr-fill: light-dark(#e8ecf4, #212c48); --qr-dg: light-dark(#c4201a, #ff8a80); --qr-bar: light-dark(rgba(243,245,249,.95), rgba(13,19,34,.95)); --qr-pop: light-dark(#fff, #1d2744); }
#qrreader-ui-v2 .phone[data-dark] { --qr-sb: #fff; }
#qrreader-ui-v2 .phone * { box-sizing: border-box; }
#qrreader-ui-v2 .phone h1, #qrreader-ui-v2 .phone h2, #qrreader-ui-v2 .phone p, #qrreader-ui-v2 .phone ul, #qrreader-ui-v2 .phone dl { margin: 0; padding: 0; font-weight: 500; }
#qrreader-ui-v2 .phone p { font-weight: 400; }
#qrreader-ui-v2 .phone ul { list-style: none; }
#qrreader-ui-v2 .phone svg, #qrreader-ui-v2 .phone i[data-lucide] { width: 24px; height: 24px; flex: none; display: inline-block; }
#qrreader-ui-v2 .phone svg[data-lucide] { width: var(--qr-icon-size) !important; height: var(--qr-icon-size) !important; }
#qrreader-ui-v2 .phone svg { stroke: currentColor; }
#qrreader-ui-v2 .phone :where(button) { font: inherit; font-weight: 500; color: inherit; background: none; border: 0; margin: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
#qrreader-ui-v2 .phone button:focus-visible { outline: 3px solid var(--qr-focus); outline-offset: 2px; }
#qrreader-ui-v2 .phone .grow { flex: 1; min-height: 0; }

/* device chrome */
#qrreader-ui-v2 .statusbar { position: absolute; left: 0; right: 0; top: 0; height: 59px; z-index: 40; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 19px 30px 0 34px; color: var(--qr-sb, var(--qr-tx)); font-size: 16px; font-weight: 600; line-height: 22px; }
#qrreader-ui-v2 .statusbar .sb-r { display: flex; align-items: center; gap: 6px; }
#qrreader-ui-v2 .statusbar { --qr-icon-size: 17px; }
#qrreader-ui-v2 .statusbar svg, #qrreader-ui-v2 .statusbar i[data-lucide] { width: 17px; height: 17px; }
#qrreader-ui-v2 .island { position: absolute; left: 50%; top: 11px; width: 96px; height: 28px; margin-left: -48px; border-radius: 14px; background: #000; }
#qrreader-ui-v2 .island::after { content: ""; position: absolute; right: 14px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: #10131a; box-shadow: inset 0 0 0 2px #1b2030; }
#qrreader-ui-v2 .homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--qr-sb, var(--qr-tx)); opacity: .85; z-index: 40; pointer-events: none; }
#qrreader-ui-v2 .phone[data-sheet] .homebar { background: var(--qr-tx); }
#qrreader-ui-v2 .screen { position: absolute; inset: 59px 0 34px 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#qrreader-ui-v2 .live { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 50; margin: 0 auto; width: fit-content; max-width: 340px; padding: 10px 16px; border-radius: 22px; background: var(--qr-tx); color: var(--qr-bg); font-size: 15px; text-align: center; pointer-events: none; }
#qrreader-ui-v2 .live:empty { display: none; }

/* shared controls */
#qrreader-ui-v2 .qr-button { flex: 1 1 0; min-width: 0; min-height: 50px; padding: 0 20px; border-radius: var(--qr-r); background: var(--qr-fill); color: var(--qr-accent); font-size: 17px; }
#qrreader-ui-v2 .qr-button.primary { background: var(--qr-accent); color: var(--qr-on); }
#qrreader-ui-v2 .qr-button.danger { background: var(--qr-fill); color: var(--qr-dg); }
#qrreader-ui-v2 .empty .qr-button, #qrreader-ui-v2 .campanel .qr-button { flex: none; }
#qrreader-ui-v2 .icobtn { width: 44px; height: 44px; border-radius: 22px; color: var(--qr-accent); }
#qrreader-ui-v2 .txtbtn { min-height: 44px; padding: 0 8px; color: var(--qr-accent); font-size: 17px; font-weight: 400; gap: 2px; }
#qrreader-ui-v2 .txtbtn.danger { color: var(--qr-dg); }
#qrreader-ui-v2 .tabs { flex: none; height: 49px; display: flex; background: var(--qr-bar); border-top: 1px solid var(--qr-ln); position: relative; z-index: 3; }
#qrreader-ui-v2 .tabs button { flex: 1; flex-direction: column; gap: 1px; color: var(--qr-sub); font-size: 11px; font-weight: 500; }
#qrreader-ui-v2 .tabs button[aria-current] { color: var(--qr-accent); }
#qrreader-ui-v2 .tabs svg, #qrreader-ui-v2 .tabs i[data-lucide] { width: 28px; height: 28px; }
#qrreader-ui-v2 .tabs { --qr-icon-size: 28px; }
#qrreader-ui-v2 .body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px; }
#qrreader-ui-v2 .acts { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; }
#qrreader-ui-v2 .acts2 { display: flex; gap: 8px; }
#qrreader-ui-v2 .payload { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font-size: 17px; line-height: 1.55; }
#qrreader-ui-v2 .payload.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
#qrreader-ui-v2 .rkind { font-size: 14px; color: var(--qr-sub); }
#qrreader-ui-v2 .chip { display: inline-flex; align-items: center; padding: 0 10px; min-height: 24px; border-radius: 12px; background: var(--qr-fill); color: var(--qr-sub); font-size: 13px; font-weight: 500; }

/* lists */
#qrreader-ui-v2 .list { margin: 0 16px; border-radius: var(--qr-r); background: var(--qr-surface); overflow: hidden; }
#qrreader-ui-v2 .list li { display: flex; align-items: center; }
#qrreader-ui-v2 .list li + li { border-top: 1px solid var(--qr-ln); }
#qrreader-ui-v2 .rowbtn { flex: 1; min-width: 0; min-height: 64px; padding: 8px 16px; gap: 12px; justify-content: flex-start; text-align: left; font-weight: 400; }
#qrreader-ui-v2 .ricon { display: inline-flex; align-items: center; justify-content: center; width: 28px; flex: none; color: var(--qr-accent); }
#qrreader-ui-v2 .rtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#qrreader-ui-v2 .rval { font-size: 17px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#qrreader-ui-v2 .rsub { font-size: 14px; color: var(--qr-sub); line-height: 1.4; }
#qrreader-ui-v2 .chev { color: var(--qr-sub); display: inline-flex; }
#qrreader-ui-v2 .del { width: 44px; height: 44px; margin-left: 4px; color: var(--qr-dg); }
#qrreader-ui-v2 .grp { padding: 24px 32px 8px; font-size: 14px; color: var(--qr-sub); font-weight: 400; }
#qrreader-ui-v2 .clearrow { display: flex; justify-content: center; padding: 16px; }
#qrreader-ui-v2 .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 32px 40px; text-align: center; color: var(--qr-sub); }
#qrreader-ui-v2 .empty svg, #qrreader-ui-v2 .empty i[data-lucide] { width: 32px; height: 32px; }
#qrreader-ui-v2 .empty { --qr-icon-size: 32px; }
#qrreader-ui-v2 .empty .et { font-size: 17px; font-weight: 500; color: var(--qr-tx); }
#qrreader-ui-v2 .empty p { font-size: 15px; }
#qrreader-ui-v2 .empty .qr-button { margin-top: 12px; }
#qrreader-ui-v2 .steps li { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
#qrreader-ui-v2 .steps .st { font-size: 17px; font-weight: 500; }
#qrreader-ui-v2 .steps .sd { font-size: 15px; color: var(--qr-sub); }
#qrreader-ui-v2 .fine { font-size: 14px; color: var(--qr-sub); text-align: center; padding-top: 12px; }
#qrreader-ui-v2 .first h1 { font-size: 30px; line-height: 1.25; }
#qrreader-ui-v2 .appicon { width: 72px; height: 72px; border-radius: 16px; display: block; }

/* camera */
#qrreader-ui-v2 .scene { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 25% 15%, #747b87 0, transparent 60%), radial-gradient(110% 90% at 85% 95%, #353a43 0, transparent 60%), linear-gradient(160deg, #5a616c, #2b2f36); }
#qrreader-ui-v2 .scene::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(35deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px); filter: blur(1px); }
#qrreader-ui-v2 .scene.paused::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); }
#qrreader-ui-v2 .scene .paper { position: absolute; left: 50%; top: 46%; width: 148px; height: 148px; margin: -74px 0 0 -74px; padding: 12px; background: #fff; border-radius: 4px; }
#qrreader-ui-v2 .scene .paper img { display: block; width: 100%; height: 100%; }
#qrreader-ui-v2 .reticle { position: absolute; left: 50%; top: 46%; width: 224px; height: 224px; margin: -112px 0 0 -112px; }
#qrreader-ui-v2 .reticle b { position: absolute; width: 32px; height: 32px; border: 0 solid #fff; }
#qrreader-ui-v2 .reticle b:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; border-top-left-radius: 10px; }
#qrreader-ui-v2 .reticle b:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; border-top-right-radius: 10px; }
#qrreader-ui-v2 .reticle b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 10px; }
#qrreader-ui-v2 .reticle b:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 10px; }
#qrreader-ui-v2 .campanel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 32px; text-align: center; }
#qrreader-ui-v2 .campanel svg, #qrreader-ui-v2 .campanel i[data-lucide] { width: 32px; height: 32px; color: var(--qr-sub); }
#qrreader-ui-v2 .campanel { --qr-icon-size: 32px; }
#qrreader-ui-v2 .campanel h2 { font-size: 18px; line-height: 1.4; }
#qrreader-ui-v2 .campanel p { font-size: 15px; color: var(--qr-sub); }
#qrreader-ui-v2 .campanel .qr-button { margin-top: 8px; width: auto; }
#qrreader-ui-v2 .campanel button svg, #qrreader-ui-v2 .campanel button i[data-lucide] { width: 24px; height: 24px; color: inherit; }
#qrreader-ui-v2 .campanel button { --qr-icon-size: 24px; }
#qrreader-ui-v2 .scanbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 16px 16px; }
#qrreader-ui-v2 .camframe { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 20px; overflow: hidden; background: var(--qr-surface); box-shadow: inset 0 0 0 1px var(--qr-ln); }
#qrreader-ui-v2 .camframe.fill { flex: 1; }
#qrreader-ui-v2 .hint { font-size: 15px; color: var(--qr-sub); text-align: center; padding-top: 16px; }

/* Clear (native) */
#qrreader-ui-v2 .nvhead { flex: none; }
#qrreader-ui-v2 .navrow { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 8px; }
#qrreader-ui-v2 .navrow > div { display: flex; align-items: center; }
#qrreader-ui-v2 .nvhead h1 { padding: 0 16px 8px; font-size: 32px; line-height: 44px; letter-spacing: 0; }
#qrreader-ui-v2 .nvbody { flex: 1; min-height: 0; overflow-y: auto; }
#qrreader-ui-v2 .phone.native .first { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 40px 24px 16px; }
#qrreader-ui-v2 .phone.native .first h1 { text-align: center; margin: 16px 0 24px; }
#qrreader-ui-v2 .phone.native .first .appicon { margin: 0 auto; }
#qrreader-ui-v2 .group { border-radius: var(--qr-r); background: var(--qr-surface); overflow: hidden; }
#qrreader-ui-v2 .phone.native .first .qr-button { flex: none; width: 100%; }
#qrreader-ui-v2 .phone.native .rbody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; }
#qrreader-ui-v2 .phone.native .rtitle { font-size: 32px; line-height: 40px; margin: 4px 0 16px; overflow-wrap: anywhere; }
#qrreader-ui-v2 .phone.native .group .payload { padding: 16px; }

/* Camera (focus) */
#qrreader-ui-v2 .fscreen { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--qr-bg); }
#qrreader-ui-v2 .fscreen.dark { background: #111317; }
#qrreader-ui-v2 .phone.focus[data-dark], #qrreader-ui-v2 .phone.focus .layer.dark { background: #111317; }
#qrreader-ui-v2 .fscreen > .scene { inset: -59px 0 -34px 0; }
#qrreader-ui-v2 .ftop { position: relative; z-index: 2; flex: none; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 8px 0 16px; }
#qrreader-ui-v2 .ftop .ftitle { font-size: 22px; line-height: 28px; }
#qrreader-ui-v2 .ftop .icobtn:first-child { margin-left: -8px; }
#qrreader-ui-v2 .ftools { display: flex; align-items: center; }
#qrreader-ui-v2 .fmid { position: relative; z-index: 2; flex: 1; min-height: 0; }
#qrreader-ui-v2 .fmid .hint { position: absolute; left: 0; right: 0; bottom: 40px; padding: 0; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
#qrreader-ui-v2 .fmid .campanel { color: #fff; }
#qrreader-ui-v2 .shade { position: absolute; inset: -59px 0 -34px 0; background: linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.78)); }
#qrreader-ui-v2 .fcontent { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 16px 24px 16px; }
#qrreader-ui-v2 .fcontent h1 { font-size: 30px; line-height: 1.25; }
#qrreader-ui-v2 .fcontent .steps li { padding: 8px 0; }
#qrreader-ui-v2 .fcontent .appicon { width: 56px; height: 56px; border-radius: 13px; }
#qrreader-ui-v2 .fcontent .qr-button { flex: none; width: 100%; }
#qrreader-ui-v2 .phone.focus .list { background: none; border-radius: 0; margin: 0; }
#qrreader-ui-v2 .phone.focus .rowbtn { padding: 8px 16px; }
#qrreader-ui-v2 .phone.focus .grp { padding: 20px 16px 4px; }
#qrreader-ui-v2 .dim { position: absolute; inset: -59px 0 -34px 0; background: rgba(0,0,0,.45); z-index: 4; }
#qrreader-ui-v2 .sheet { position: absolute; left: 0; right: 0; bottom: -34px; z-index: 5; max-height: 460px; display: flex; flex-direction: column; padding: 8px 16px 34px; border-radius: 20px 20px 0 0; background: var(--qr-bg); color: var(--qr-tx); }
#qrreader-ui-v2 .grab { align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--qr-ln); margin-bottom: 4px; flex: none; }
#qrreader-ui-v2 .sh-top { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; }
#qrreader-ui-v2 .sh-top .icobtn { margin: 0 -8px 0 auto; color: var(--qr-sub); }
#qrreader-ui-v2 .sheet .rtitle { flex: none; font-size: 22px; line-height: 30px; margin: 0 0 8px; overflow-wrap: anywhere; }
#qrreader-ui-v2 .sheet .payload { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 16px; border-radius: var(--qr-r); background: var(--qr-surface); }
#qrreader-ui-v2 .sheet .acts { padding: 12px 0 0; }
#qrreader-ui-v2 .phone.focus .sheet { --qr-focus: var(--qr-accent); }

/* Soft */
#qrreader-ui-v2 .sf { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#qrreader-ui-v2 .sfhead { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 8px 12px 8px 20px; }
#qrreader-ui-v2 .sfhead h1 { font-size: 30px; line-height: 38px; }
#qrreader-ui-v2 .sfhead .hr { display: flex; align-items: center; }
#qrreader-ui-v2 .sfnav { flex: none; height: 44px; padding: 0 12px; display: flex; align-items: center; }
#qrreader-ui-v2 .sf .list { margin: 0 16px; background: none; border-radius: 0; overflow: visible; }
#qrreader-ui-v2 .sf .list li { background: var(--qr-surface); border: 1px solid var(--qr-ln); border-radius: 16px; margin-bottom: 8px; }
#qrreader-ui-v2 .sf .list li + li { border-top: 1px solid var(--qr-ln); }
#qrreader-ui-v2 .sf .rowbtn { min-height: 72px; padding: 12px 16px; }
#qrreader-ui-v2 .sf .grp { padding: 16px 20px 8px; }
#qrreader-ui-v2 .sf .camframe { margin: 0; border-radius: 24px; flex-basis: 440px; }
#qrreader-ui-v2 .sf .hint { text-align: left; padding: 16px 4px 0; font-size: 17px; color: var(--qr-tx); }
#qrreader-ui-v2 .phone.soft .first { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 32px 20px 16px; gap: 24px; }
#qrreader-ui-v2 .phone.soft .first .appicon { width: 56px; height: 56px; border-radius: 13px; }
#qrreader-ui-v2 .phone.soft .first .steps { display: flex; flex-direction: column; gap: 8px; }
#qrreader-ui-v2 .phone.soft .first .steps li { background: var(--qr-surface); border: 1px solid var(--qr-ln); border-radius: 16px; }
#qrreader-ui-v2 .phone.soft .first .qr-button { flex: none; width: 100%; }
#qrreader-ui-v2 .phone.soft .rbody { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; }
#qrreader-ui-v2 .rcard { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 20px; background: var(--qr-surface); border: 1px solid var(--qr-ln); }
#qrreader-ui-v2 .rcard .top { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--qr-sub); }
#qrreader-ui-v2 .rcard .payload { font-size: 20px; line-height: 1.6; }
#qrreader-ui-v2 .rcard .payload.mono { font-size: 16px; }

/* dialogs */

      tweak.addSelect(options, 'appearance', { label: '外観', options: [{ label: '自動', value: 'light dark' }, { label: 'ライト', value: 'light' }, { label: 'ダーク', value: 'dark' }] });
    });
  }
})();
</script>
</div>
